<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>

        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: black;
            color: white;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

    </style>
</head>

<body>

    <h1 style="text-align:center;">
        Student Information
    </h1>

    <table>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Email</th>
        </tr>

        <tr>
            <td>Ali</td>
            <td>18</td>
            <td>A</td>
            <td>ali@gmail.com</td>
        </tr>

        <tr>
            <td>Ahmed</td>
            <td>19</td>
            <td>A+</td>
            <td>ahmed@gmail.com</td>
        </tr>

        <tr>
            <td>Hassan</td>
            <td>18</td>
            <td>B</td>
            <td>hassan@gmail.com</td>
        </tr>

    </table>

</body>
</html>
