<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .card {
            width: 300px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin: 50px auto;
            text-align: center;
            transition: 0.3s;
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 5px 15px gray;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: green;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }

    </style>
</head>

<body>

    <div class="card">

<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800&q=80" alt="Laptop">
        <h2>Gaming Laptop</h2>

        <p>
            A powerful laptop suitable for gaming,
            programming and everyday use.
        </p>

        <p class="price">$999</p>

        <button>Buy Now</button>

    </div>

</body>
</html>
