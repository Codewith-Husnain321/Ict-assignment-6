<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login {
            width: 350px;
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <form>

            <input
                type="text"
                placeholder="Username"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">Submit</button>

            <a href="#" class="forgot">
                Forgot Password?
            </a>

        </form>

    </div>

</body>
</html>
